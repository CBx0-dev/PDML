name: CD

on:
  workflow_dispatch:
    inputs:
      type:
        description: "release = NuGet packages, LSP, compiler CLI. vscode = extension only (own version)"
        type: choice
        required: true
        options:
          - release
          - vscode
      version:
        description: "Version to use for the package (e.g 1.2.3)"
        type: string
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VERSION: ${{ inputs.version }}

jobs:
  test:
    if: ${{ inputs.type == 'release' }}
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        run: |
          set -euo pipefail
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 1.2.3"; exit 1; }
          
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"
          then
            echo "::error::version $VERSION already exists"
            exit 1
          fi
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]
          then
            echo "::error::Releases can only be cut from '${{ github.event.repository.default_branch }}'."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=$VERSION

      - name: Test
        run: dotnet test -c Release --no-build
  
  packages:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Pack
        run: |
          set -euo pipefail
          dotnet pack -c Release -p:Version=$VERSION -o ./nupkg

      - name: NuGet Login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  binaries:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: win-x64
            os: ubuntu-latest
            ext: .exe
            archive: zip
          - rid: win-arm64
            os: ubuntu-latest
            ext: .exe
            archive: zip
          - rid: linux-x64
            os: ubuntu-latest
            ext: ""
            archive: tar.gz
          - rid: linux-arm64
            os: ubuntu-latest
            ext: ""
            archive: tar.gz
          - rid: osx-x64
            os: macos-latest
            ext: ""
            archive: tar.gz
          - rid: osx-arm64
            os: macos-latest
            ext: ""
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish LSP
        run: |
          dotnet publish \
            src/PDML.Plugin.LSP \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:Version=${{ env.VERSION }} \
            -o out/lsp

      - name: Publish CLI
        run: |
          dotnet publish \
            src/PDML \
            -c Release \
            -r ${{ matrix.rid }} \
            -p:PublishSingleFile=false \
            -p:Version=${{ env.VERSION }} \
            -o out/cli

      - name: Collect assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp  "out/lsp/PDML.Plugin.LSP${{ matrix.ext }}" "dist/pdml-lsp-${{ matrix.rid }}${{ matrix.ext }}"
          if [ "${{ matrix.archive }}" = "zip" ]
          then
            (cd out/cli && zip -qr "$GITHUB_WORKSPACE/dist/pdml-cli-${{ matrix.rid }}.zip" .)
          else
            tar -czf "dist/pdml-cli-${{ matrix.rid }}.tar.gz" -C out/cli .
          fi
          
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  
  release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create Release
        run: |
          set -euo pipefail
          gh release create "v$VERSION" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PDML v$VERSION" \
            --latest \
            --draft

  vscode:
    if: ${{ inputs.type == 'vscode' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Validate
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 1.2.3"; exit 1; }
          
          if git ls-remote --exit-code --tags origin "refs/tags/vscode-v$VERSION" >/dev/null 2>&1
          then
          echo "::error::Tag vscode-v$VERSION already exists."
          exit 1
          fi
          
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then
          echo "::error::Publishing is only allowed from '${{ github.event.repository.default_branch }}'."; exit 1
          fi
          
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/PDML.Plugin.VSCode/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Package
        working-directory: src/PDML.Plugin.VSCode
        run: |
          pnpm version $VERSION --no-git-tag-version
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run package

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "src/PDML.Plugin.VSCode/*.vsix"
          retention-days: 30

      - name: Publish & Marketplace
        working-directory: src/PDML.Plugin.VSCode
        run: npx --yes @vscode/vsce@^4.1.0 publish --oidc --packagePath ./pdmllp-$VERSION.vsix

      - name: Tag extension version
        run: |
          git tag "vscode-$VERSION"
          git push origin "vscode-$VERSION"
      